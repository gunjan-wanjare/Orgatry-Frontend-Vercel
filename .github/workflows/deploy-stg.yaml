name: Build and deploy website
on:
  push:
    branches:
      - staging
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crediple-india-private-limited/orgatry-frontend
jobs:
  
  
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Get Github Action IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Set environment variables
        run: |
          echo "AWS_DEFAULT_REGION=ap-south-2" >> $GITHUB_ENV
          echo "AWS_SG_NAME_STG=sg-0b463de2b38482e46" >> $GITHUB_ENV

      - name: Add GitHub Actions IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ env.AWS_SG_NAME_STG }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_DEFAULT_REGION }}
          
      - name: Fetch Frontend Secrets
        run: |
          aws secretsmanager get-secret-value \
            --secret-id orgatry-frontend/staging \
            --region ap-south-2 \
            --query SecretString \
            --output text > .env.json

          cat .env.json | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env

          echo "Generated .env file:"
          cat .env
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-2

      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_NAME=torgatry-frontend
            NODE_ENV=main
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/stg.key
          chmod 600 ~/.ssh/stg.key
          cat >> ~/.ssh/config << EOF
          Host stage
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/stg.key
            StrictHostKeyChecking no
          EOF
        env:
          SSH_USER: ${{ secrets.SSH_USER_STG }}
          SSH_KEY: ${{ secrets.SSH_KEY_STG }}
          SSH_HOST: ${{ secrets.SSH_HOST_STG }}

      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-2
        run: |
          ssh stage 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin'

          ssh stage "export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} && export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} && export AWS_DEFAULT_REGION=ap-south-2 && cd /var/www/html/orgatry-frontend && echo 'Fetching secrets...' && aws secretsmanager get-secret-value --secret-id orgatry-frontend/staging --region ap-south-2 --query SecretString --output text > /tmp/secrets.json && jq -r 'to_entries[] | \"\(.key)=\(.value)\"' /tmp/secrets.json > .env && rm /tmp/secrets.json && chmod 600 .env && echo 'Starting deployment...' && docker system prune -f && docker-compose pull && docker-compose down && docker-compose up -d --force-recreate && echo 'Deployment complete'"

      - name: Remove GitHub Actions IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ env.AWS_SG_NAME_STG }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_DEFAULT_REGION }}
