name: Build and deploy website

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crediple-india-private-limited/orgatry-frontend
  AWS_DEFAULT_REGION: ap-south-2
  AWS_SG_NAME_PROD: sg-0cbe5ee7493a2b31c

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Trivy Filesystem Scan
        run: |
          mkdir -p trivy-report
          trivy fs . \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-report/code-scan.txt

      - name: Get Github Action IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Debug IP and SG
        run: |
          echo "Runner IP: ${{ steps.ip.outputs.ipv4 }}"
          echo "Security Group: $AWS_SG_NAME_PROD"
          echo "Region: $AWS_DEFAULT_REGION"

      - name: Add GitHub Actions IP to Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "$AWS_SG_NAME_PROD" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.ip.outputs.ipv4 }}/32"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_DEFAULT_REGION }}

      - name: Fetch Frontend Secrets
        run: |
          aws secretsmanager get-secret-value \
            --secret-id orgatry-frontend/production \
            --region ap-south-2 \
            --query SecretString \
            --output text > .env.json

          cat .env.json | jq -r 'to_entries[] | "\(.key)=\(.value)"' > .env

          echo "Generated .env file:"
          cat .env
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-2

      - name: Export Secret Values
        run: |
          echo "VITE_API_BASE_URL=$(grep '^VITE_API_BASE_URL=' .env | cut -d= -f2-)" >> $GITHUB_ENV
          echo "VITE_APP_NAME=$(grep '^VITE_APP_NAME=' .env | cut -d= -f2-)" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_NAME=orgatry-frontend
            NODE_ENV=main
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_APP_NAME=${{ env.VITE_APP_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trivy Docker Image Scan
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-report/image-scan.txt \
            "$IMAGE"

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/stg.key
          chmod 600 ~/.ssh/stg.key

          cat >> ~/.ssh/config << EOF
          Host stage
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/stg.key
            StrictHostKeyChecking no
          EOF
        env:
          SSH_USER: ${{ secrets.SSH_USER_PROD }}
          SSH_KEY: ${{ secrets.SSH_KEY_PROD }}
          SSH_HOST: ${{ secrets.SSH_HOST_PROD }}

      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-2

        run: |
          ssh stage 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin'

          ssh stage "
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} &&
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} &&
          export AWS_DEFAULT_REGION=ap-south-2 &&
          cd /var/www/html/orgatry-frontend &&
          echo 'Fetching secrets...' &&
          aws secretsmanager get-secret-value \
            --secret-id orgatry-frontend/production \
            --region ap-south-2 \
            --query SecretString \
            --output text \
            > /tmp/secrets.json &&
          jq -r 'to_entries[] | \"\(.key)=\(.value)\"' \
            /tmp/secrets.json > .env &&
          rm /tmp/secrets.json &&
          chmod 600 .env &&
          echo 'Starting deployment...' &&
          docker network inspect shared-network >/dev/null 2>&1 || docker network create shared-network &&
          docker-compose pull &&
          docker-compose up -d --force-recreate &&
          docker image prune -af &&
          echo 'Deployment complete'
          "

      - name: Remove GitHub Actions IP
        if: always()
        run: |
          if [ -n "$AWS_SG_NAME_PROD" ] && [ -n "${{ steps.ip.outputs.ipv4 }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "$AWS_SG_NAME_PROD" \
              --protocol tcp \
              --port 22 \
              --cidr "${{ steps.ip.outputs.ipv4 }}/32"
          else
            echo "Skipping Security Group cleanup because SG ID or IP is empty."
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.AWS_DEFAULT_REGION }}

